<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · The Collection</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="app-header">
  <div class="app-header-inner">
    <p class="brand"><span class="dot"></span> Admin</p>
    <nav class="console-tabs">
      <button class="console-tab active" data-panel="games">Games</button>
      <button class="console-tab" data-panel="add-console">Add console</button>
      <button class="console-tab" data-panel="settings">Settings</button>
      <a class="console-tab" href="../index.html" style="text-decoration:none;">View site</a>
      <button class="console-tab" id="logout-btn">Log out</button>
    </nav>
  </div>
</header>

<main class="admin-shell">

  <!-- GAMES PANEL -->
  <section id="panel-games">
    <div class="controls">
      <select class="filter-select" id="console-select"></select>
      <input type="text" class="search-input" id="admin-search" placeholder="Search titles to edit…">
      <button class="btn-ghost" id="add-game-btn" style="width:auto;padding:11px 16px;">+ Add game</button>
    </div>
    <div class="stats-row" id="admin-stats"></div>

    <div class="admin-row header">
      <span>Title</span><span>Owned</span><span>Manual</span><span>Boxed</span><span>Condition</span>
    </div>
    <div id="admin-rows"></div>

    <div class="save-bar">
      <button class="btn" id="save-btn" style="width:auto;padding:11px 22px;">Save changes</button>
      <span class="save-status" id="save-status"></span>
    </div>
  </section>

  <!-- ADD CONSOLE PANEL -->
  <section id="panel-add-console" style="display:none;">
    <div class="token-form" style="max-width:480px;">
      <label class="field-label" for="new-console-name">Console name</label>
      <input type="text" id="new-console-name" placeholder="e.g. PlayStation 2">
      <p class="help-text">Creates a new empty collection tab. You can then add games to it from the Games panel.</p>
      <button class="btn" id="create-console-btn">Create console tab</button>
      <p class="save-status" id="add-console-status"></p>
    </div>
  </section>

  <!-- SETTINGS PANEL -->
  <section id="panel-settings" style="display:none;">
    <div class="token-form" style="max-width:480px;">
      <label class="field-label" for="new-site-passcode">New site passcode (for visitors)</label>
      <input type="text" id="new-site-passcode" placeholder="Leave blank to keep current">
      <label class="field-label" for="new-admin-password">New admin password</label>
      <input type="text" id="new-admin-password" placeholder="Leave blank to keep current">
      <button class="btn" id="save-passcodes-btn">Update passcodes</button>
      <p class="save-status" id="passcode-status"></p>
    </div>
  </section>

</main>

<script src="../js/auth.js"></script>
<script src="../js/github-api.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
