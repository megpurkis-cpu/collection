<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Collection</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== PASSCODE GATE ===== -->
<section id="gate" class="gate">
  <div class="gate-card">
    <div class="orb"><div class="orb-core"></div></div>
    <p class="eyebrow">Private collection</p>
    <h1>Enter passcode</h1>
    <input type="password" id="passcode-input" autocomplete="off" inputmode="text" placeholder="••••••••">
    <button class="btn" id="unlock-btn">Unlock</button>
    <p class="gate-error" id="gate-error"></p>
  </div>
</section>

<!-- ===== MAIN APP (hidden until unlocked) ===== -->
<div id="app" style="display:none;">
  <header class="app-header">
    <div class="app-header-inner">
      <p class="brand"><span class="dot"></span> The Collection</p>
      <div class="view-toggle" id="view-toggle">
        <button type="button" class="view-toggle-btn active" data-view="games">Games</button>
        <button type="button" class="view-toggle-btn" data-view="hardware">Consoles</button>
      </div>
      <span id="grand-total" class="grand-total"></span>
      <select class="filter-select" id="console-picker" style="margin-left:auto;max-width:220px;"></select>
    </div>
  </header>

  <main>
    <div class="stats-row" id="stats-row"></div>

    <div class="controls">
      <div class="search-wrap">
        <input type="text" class="search-input" id="search-input" placeholder="Search titles…">
        <button type="button" id="search-clear" class="search-clear" aria-label="Clear search">&times;</button>
      </div>
      <select class="filter-select" id="filter-owned">
        <option value="all">All games</option>
        <option value="owned">Owned only</option>
        <option value="wishlist">Not owned yet</option>
      </select>
      <select class="filter-select" id="filter-manual">
        <option value="all">Manual: any</option>
        <option value="yes">Manual present</option>
        <option value="no">Manual missing</option>
        <option value="unknown">Manual unknown</option>
      </select>
      <select class="filter-select" id="filter-boxed">
        <option value="all">Boxed: any</option>
        <option value="yes">Boxed</option>
        <option value="no">Not boxed</option>
        <option value="unknown">Unrecorded</option>
      </select>
    </div>

    <div class="table-scroll">
    <table class="game-table" id="games-table">
      <thead>
        <tr>
          <th data-sort="title">Title</th>
          <th data-sort="condition">Condition</th>
          <th data-sort="manual">Manual</th>
          <th data-sort="boxed">Boxed</th>
          <th data-sort="price">CEX price</th>
        </tr>
      </thead>
      <tbody id="game-rows"></tbody>
    </table>
    <table class="game-table" id="hardware-table" style="display:none;">
      <thead>
        <tr>
          <th data-hsort="title">Console</th>
          <th data-hsort="variation">Variation</th>
          <th data-hsort="condition">Condition</th>
          <th data-hsort="manual">Manual</th>
          <th data-hsort="boxed">Boxed</th>
          <th data-hsort="price">CEX price</th>
        </tr>
      </thead>
      <tbody id="hardware-rows"></tbody>
    </table>
    </div>
    <p class="empty-state" id="empty-state" style="display:none;"></p>

    <p class="footer-note">retro-classix collection tracker · prices auto-update weekly from CEX · <a href="admin/">admin</a></p>
  </main>
</div>

<script src="js/auth.js"></script>
<script src="js/site.js"></script>
</body>
</html>
