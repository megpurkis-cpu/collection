<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · The Collection</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<section class="gate">
  <div class="gate-card token-form">
    <div class="orb"><div class="orb-core"></div></div>
    <p class="eyebrow">Admin</p>
    <h1>Sign in</h1>

    <label class="field-label" for="admin-password">Admin password</label>
    <input type="password" id="admin-password" autocomplete="off">

    <label class="field-label" for="gh-owner">GitHub username</label>
    <input type="text" id="gh-owner" placeholder="e.g. meg-something" autocomplete="off">

    <label class="field-label" for="gh-repo">Repo name</label>
    <input type="text" id="gh-repo" value="collection" autocomplete="off">

    <label class="field-label" for="gh-token">GitHub personal access token</label>
    <input type="password" id="gh-token" placeholder="ghp_…" autocomplete="off">
    <p class="help-text">
      Needs a token with "repo" access so it can save changes to <code>collection</code> for you.
      Create one at GitHub.com → Settings → Developer settings → Personal access tokens.
      This stays in this browser only — it's never written into the repo.
    </p>

    <button class="btn" id="admin-login-btn">Sign in</button>
    <p class="gate-error" id="admin-login-error"></p>
  </div>
</section>

<script src="../js/auth.js"></script>
<script>
const loginBtn = document.getElementById('admin-login-btn');
const errEl = document.getElementById('admin-login-error');

// If already signed in this session, skip straight to the dashboard.
if (isUnlocked('admin') && localStorage.getItem('collection_gh_token')) {
  window.location.href = 'dashboard.html';
}

loginBtn.addEventListener('click', async () => {
  errEl.textContent = '';
  const pw = document.getElementById('admin-password').value;
  const owner = document.getElementById('gh-owner').value.trim();
  const repo = document.getElementById('gh-repo').value.trim();
  const token = document.getElementById('gh-token').value.trim();

  if (!pw || !owner || !repo || !token) {
    errEl.textContent = 'Please fill in every field.';
    return;
  }

  try {
    const auth = await loadAuthConfig('../data/auth.json');
    const hash = await sha256Hex(pw);
    if (hash !== auth.adminHash) {
      errEl.textContent = 'Incorrect admin password.';
      return;
    }
  } catch (e) {
    errEl.textContent = 'Could not verify password — try reloading.';
    return;
  }

  // Store GitHub connection details locally (this browser only) for the session.
  localStorage.setItem('collection_gh_owner', owner);
  localStorage.setItem('collection_gh_repo', repo);
  localStorage.setItem('collection_gh_token', token);
  setUnlocked('admin');
  window.location.href = 'dashboard.html';
});
</script>
</body>
</html>
